# Zabbix agent 2 jälgitavatesse masinatesse.
# Täida iga <TÄIDA> koht. Juhend: praktikum 4, osa 2.
# Käivitus: ansible-playbook -i proxmox2,proxmox3, konf/agent.yml
- name: Zabbix agent 2 jälgitavatesse masinatesse
  hosts: all
  become: true
  vars:
    zabbix_server: "<TÄIDA: proxmox1 IP-aadress>"
  tasks:
    - name: Zabbixi pakettide allkirjavõti
      ansible.builtin.rpm_key:
        key: https://repo.zabbix.com/RPM-GPG-KEY-ZABBIX-B5333005
        state: present

    - name: Zabbix 7.0 repositoorium
      ansible.builtin.dnf:
        name: https://repo.zabbix.com/zabbix/7.0/alma/9/x86_64/zabbix-release-latest-7.0.el9.noarch.rpm
        state: present

    - name: Kas EPEL on olemas
      ansible.builtin.stat:
        path: /etc/yum.repos.d/epel.repo
      register: epel

    - name: EPEL ei paku Zabbixi pakette
      ansible.builtin.lineinfile:
        path: /etc/yum.repos.d/epel.repo
        insertafter: '^\[epel\]'
        line: excludepkgs=zabbix*
      when: epel.stat.exists

    - name: Agendi pakett
      ansible.builtin.dnf:
        name: zabbix-agent2
        state: present

    - name: Agendi seaded
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: Server, value: "{{ zabbix_server }}" }
        # <TÄIDA> veel kaks rida samal kujul: aktiivse kontrolli serveri aadress ja masina nimi Zabbixis (loengu tabel 4.1)
      # <TÄIDA> võti, mis käivitab allpool oleva handler'i ainult siis, kui fail muutus

    - name: Passiivse agendi port tulemüüris
      ansible.posix.firewalld:
        port: "<TÄIDA>"
        permanent: true
        immediate: true
        state: enabled

    - name: Agent töötab ja käivitub koos masinaga
      ansible.builtin.service:
        name: zabbix-agent2
        state: started
        enabled: true

  handlers:
    - name: Taaskäivita agent
      ansible.builtin.service:
        name: zabbix-agent2
        state: "<TÄIDA>"
